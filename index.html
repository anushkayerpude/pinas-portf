<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23d47a9e'><polygon points='12 2 22 21 12 17 2 21 12 2'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#06050b" />
    <title>Anushka Yerpude // Tactical Fighter Jet Portfolio</title>
    <meta name="description" content="Aviation-grade full-stack systems engineer portfolio featuring 5th-gen fighter jets, dark space aesthetic, and nude-magenta doodle graphics." />
  </head>
  <body>
    <!-- Deep Space & Nude Magenta Doodles Canvas -->
    <canvas id="doodle-canvas"></canvas>

    <!-- Main Tactical UI -->
    <div id="app">
      <!-- Tactical Top Flight Header -->
      <header class="tactical-header">
        <div class="header-left">
          <div class="pilot-callsign-box">
            <span class="callsign-title">VIPER-01 // ANUSHKA YERPUDE</span>
            <span class="callsign-sub">FULL-STACK SYSTEMS // CREATIVE TECHNOLOGIST</span>
          </div>
          <div class="status-beacon">
            <span class="beacon-dot"></span>
            <span class="beacon-text">RADAR ACTIVE // AIRBORNE</span>
          </div>
        </div>

        <div class="header-right">
          <button class="flow-toggle-btn" id="flow-toggle-btn" aria-label="Toggle Continuous Flow View">
            <span id="flow-btn-icon">✦</span>
            <span id="flow-btn-label">FLOW: ALL OPEN</span>
          </button>
          <div class="telemetry-pill">
            <span id="telemetry-data">MACH 2.25 // ALT 52,000 FT // DEFCON 1</span>
          </div>
          <button class="audio-toggle-btn" id="audio-toggle-btn" aria-label="Toggle Tactical Audio">
            <div class="audio-bars">
              <span></span><span></span><span></span><span></span>
            </div>
            <span id="audio-btn-label">SFX: ON</span>
          </button>
        </div>
      </header>

      <!-- Main Runway Grid with Staggered Alternating Jets & Category Lines -->
      <main class="runway-container" id="runway-container">
        <!-- Rendered dynamically by main.js with in-place flowing drawers -->
      </main>

      <!-- Tactical Bottom Bar -->
      <footer class="tactical-bottom-bar">
        <div class="bottom-left-notes">
          <span>COORDINATES: 20.5937° N, 78.9629° E</span>
          <span>STEALTH ACTIVE // 0 RADAR CROSS-SECTION</span>
        </div>
        <div class="bottom-right-links">
          <a href="https://github.com/anushkayerpude" target="_blank" rel="noopener" class="bottom-link">GITHUB</a>
          <a href="https://linkedin.com" target="_blank" rel="noopener" class="bottom-link">LINKEDIN</a>
          <a href="mailto:anushkayerpude@gmail.com" class="bottom-link">TRANSMIT EMAIL</a>
        </div>
      </footer>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
